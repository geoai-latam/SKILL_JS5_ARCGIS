name: Integration Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for Playwright suite
        id: guard
        run: |
          if ls tests/integration/*.* >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No tests/integration suite yet — skipping integration tests."
          fi
      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.present == 'true'
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.guard.outputs.present == 'true'
      - run: pnpm exec playwright install --with-deps
        if: steps.guard.outputs.present == 'true'
      - run: pnpm run test:integration
        if: steps.guard.outputs.present == 'true'
        env:
          VITE_ARCGIS_API_KEY: ${{ secrets.ARCGIS_API_KEY }}
