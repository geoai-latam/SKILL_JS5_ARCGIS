name: Deploy Docs

# Manual-only until the docs site (docs/package.json) exists and GitHub Pages is
# enabled. Re-add `push: { branches: [main] }` once the Starlight site is in place.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Check for docs site
        id: guard
        run: |
          if [ -f docs/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No docs/package.json yet — skipping docs build."
          fi
      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.present == 'true'
      - uses: actions/setup-node@v7
        if: steps.guard.outputs.present == 'true'
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.guard.outputs.present == 'true'
      - run: pnpm --filter docs build
        if: steps.guard.outputs.present == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.guard.outputs.present == 'true'
        with:
          path: docs/dist
      - id: deployment
        if: steps.guard.outputs.present == 'true'
        uses: actions/deploy-pages@v5
